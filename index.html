<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Alerti</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    position: fixed;
    inset: 0;
}

iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}
</style>

</head>

<body>

<iframe
    src="https://alerti.base44.app"
    allow="geolocation; camera; microphone; fullscreen"
    allowfullscreen>
</iframe>

</body>
</html>
