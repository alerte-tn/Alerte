<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Alerti</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

#container{
    position:fixed;
    inset:0;
    overflow:hidden;
}

iframe{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:calc(100% + 120px);
    border:none;
}

#masque{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:120px;
    background:#000;
    z-index:999999;
}
</style>

</head>
<body>

<div id="container">
    <iframe src="https://alerti.base44.app"></iframe>
    <div id="masque"></div>
</div>

</body>
</html>
