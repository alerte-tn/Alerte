<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Alerti</title>

<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>

<body>

<iframe id="app" src="https://alerti.base44.app"></iframe>

<script>
window.onload = function () {
    setTimeout(function () {
        try {
            const iframe = document.getElementById("app");
            const doc = iframe.contentWindow.document;

            const btn = doc.querySelector("button");
            if (btn) btn.click();
        } catch(e) {
            console.log("Accès refusé par la politique de même origine :", e);
        }
    }, 2000);
};
</script>

</body>
</html>
