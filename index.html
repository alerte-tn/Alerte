<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

#conteneur{
    position:relative;
    width:100%;
    height:100%;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

#cache{
    position:absolute;
    top:0;
    right:0;
    width:180px;
    height:70px;
    background:#000; /* adapte la couleur au fond */
    z-index:9999;
}
</style>
</head>
<body>

<div id="conteneur">
    <iframe src="https://alerti.base44.app"></iframe>
    <div id="cache"></div>
</div>

</body>
</html>
